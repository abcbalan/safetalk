<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SafeTalk - Messenger</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; -webkit-touch-callout: none; }
    .chat-bubble-me { background: #15803d; color: white; border-bottom-right-radius: 4px; word-break: break-word; }
    .chat-bubble-me-pending { background: #15803d; color: white; opacity: 0.65; border-bottom-right-radius: 4px; word-break: break-word; border: 1.5px dashed #a7f3d0; }
    .chat-bubble-them { background: #ffffff; color: #0f172a; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; word-break: break-word; }
    body.text-sm-custom { font-size: 0.875rem; }
    body.text-lg-custom { font-size: 1rem; }
    body.text-xl-custom { font-size: 1.15rem; }
    .animated-emoji { display: inline-block; animation: emojiBounce 2s infinite ease-in-out; }
    @keyframes emojiBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.1); } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body id="appBody" class="bg-slate-100 font-sans h-full flex flex-col antialiased text-sm-custom select-none">

  <!-- TOP HEADER -->
  <header class="bg-emerald-800 text-white px-4 py-2.5 flex items-center justify-between shadow-md shrink-0 z-30">
    <div class="flex items-center space-x-3 min-w-0">
      <button id="backBtn" onclick="returnToChatList()" class="hidden text-white mr-1 hover:text-emerald-200 transition shrink-0">
        <i class="fas fa-arrow-left"></i>
      </button>
      
      <div id="headerAvatar" class="w-9 h-9 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-white shadow border border-emerald-500 shrink-0 relative">
        <i class="fas fa-shield-halved"></i>
      </div>
      <div class="min-w-0">
        <h1 class="font-bold leading-tight flex items-center gap-2 truncate" id="activeChatTitle">
          SafeTalk Chats
          <span class="bg-emerald-950 text-emerald-300 text-[10px] px-2 py-0.5 rounded-full border border-emerald-700 font-medium shrink-0">Encrypted</span>
        </h1>
        <p class="text-emerald-200 opacity-90 text-xs truncate" id="activeChatSub">Select a conversation to start</p>
      </div>
    </div>

    <div class="flex items-center space-x-2 shrink-0">
      <span id="syncStatusIndicator" class="w-2.5 h-2.5 rounded-full bg-emerald-400" title="Online & Synced"></span>
      <div id="currentUserBadge" class="text-emerald-100 bg-emerald-900 px-2.5 py-1 rounded-lg border border-emerald-700 font-medium text-xs">
        Connecting...
      </div>

  </header>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden relative">
    <!-- CHATS LIST SCREEN -->
    <div id="chatsListScreen" class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 h-full absolute md:relative z-20 inset-0">
      <div class="p-3 bg-slate-50 border-b border-slate-100 flex flex-col gap-2 shrink-0">
        <div class="relative">
          <input type="text" id="chatSearchInput" oninput="filterChatList(this.value)" placeholder="Search conversations..." class="w-full bg-white px-3 py-2 pl-8 rounded-xl border border-slate-300 focus:outline-none focus:ring-1 focus:ring-emerald-600 text-xs">
          <i class="fas fa-search absolute left-2.5 top-3 text-slate-400"></i>
        </div>
        <button onclick="openGroupCreateModal()" class="w-full py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-xl shadow transition flex items-center justify-center space-x-1.5 text-xs">
          <i class="fas fa-plus"></i>
          <span>Create New Group</span>
        </button>
      </div>

      <div class="p-2 pb-1 font-bold uppercase tracking-wider text-slate-400 px-3 opacity-80 text-[10px]">Conversations</div>
      <div id="conversationsContainer" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>
    </div>

    <!-- CHAT CONVERSATION SCREEN -->
    <main id="chatRoomScreen" class="flex-1 flex flex-col bg-slate-100 absolute md:relative inset-0 z-10 md:z-auto hidden">
      <div class="p-2 bg-white border-b border-slate-200 flex items-center justify-between px-3 shrink-0 gap-2">
        <div class="relative flex-1 min-w-0">
          <input type="text" id="historySearchInput" oninput="filterMessageHistory()" placeholder="Search messages..." class="w-full bg-slate-100 px-3 py-1.5 pl-8 rounded-lg border border-slate-300 focus:outline-none text-xs">
          <i class="fas fa-search absolute left-2.5 top-2 text-slate-400 text-xs"></i>
        </div>

        <div class="flex items-center space-x-1.5 shrink-0">
          <select id="retentionSelect" class="bg-slate-100 border border-slate-300 rounded-lg px-2 py-1.5 text-slate-700 focus:outline-none font-medium text-xs">
            <option value="forever" selected>⏳ Keep Forever</option>
            <option value="1m">⏱️ 1 Min Test</option>
            <option value="8h">⏳ 8 Hours</option>
            <option value="7d">⏳ 1 Week</option>
          </select>
          <select id="fontSizeSelect" onchange="changeFontSize(this.value)" class="bg-slate-100 border border-slate-300 rounded-lg px-2 py-1.5 focus:outline-none text-xs">
            <option value="sm">Normal</option>
            <option value="lg">Large</option>
            <option value="xl">XL</option>
          </select>
        </div>
      </div>

      <!-- MESSAGES DISPLAY AREA -->
      <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3"></div>

      <!-- VOICE RECORDING BAR -->
      <div id="voiceRecordingBar" class="hidden px-4 py-2 bg-emerald-50 border-t border-emerald-200 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-red-500 animate-ping"></span>
          <span class="font-bold text-slate-700 text-xs" id="recordingTimer">Recording: 0s</span>
        </div>
        <button type="button" onclick="stopAndSendVoice()" class="px-3 py-1 bg-emerald-700 text-white font-bold rounded-lg shadow hover:bg-emerald-800 text-xs">
          <i class="fas fa-paper-plane mr-1"></i> Send Voice
        </button>
      </div>

      <!-- INPUT BAR -->
      <form onsubmit="handleMessageSubmit(event)" class="p-3 bg-white border-t border-slate-200 flex flex-col gap-2 shadow-lg shrink-0">
        <div class="flex gap-2 items-center">
          <label class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full cursor-pointer transition flex items-center justify-center shrink-0" title="Select Photo">
            <i class="fas fa-camera text-sm"></i>
            <input type="file" id="chatImageInput" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
          </label>

          <label class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full cursor-pointer transition flex items-center justify-center shrink-0" title="Attach Document or PDF">
            <i class="fas fa-paperclip text-sm"></i>
            <input type="file" id="chatDocInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" class="hidden" onchange="handleDocSelected(event)">
          </label>

          <button type="button" id="micBtn" onclick="toggleVoiceRecording()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-emerald-700 rounded-full transition flex items-center justify-center shrink-0" title="Record Voice">
            <i class="fas fa-microphone text-sm"></i>
          </button>

          <input type="text" id="messageInput" placeholder="SafeTalk message or link..." class="flex-1 px-4 py-2 border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white text-xs">
          
          <button type="submit" id="sendSubmitBtn" class="w-9 h-9 bg-emerald-700 hover:bg-emerald-800 text-white rounded-full shadow transition flex items-center justify-center shrink-0">
            <i class="fas fa-paper-plane text-xs"></i>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://yigcsrhbsietdmdylooi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fl7g8SR6zNJmo06dw4EB1Q_s8ee16Je';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const SECRET_KEY = "SafeTalkFamilyKey2026";

    const familyMembers = [
      { name: "Mum", email: "mum@family.com", icon: "fa-person-dress", bg: "bg-pink-600" },
      { name: "Dad", email: "dad@family.com", icon: "fa-user-tie", bg: "bg-blue-600" },
      { name: "Alex", email: "alex@family.com", icon: "fa-user-graduate", bg: "bg-amber-600" },
      { name: "Sarah", email: "sarah@family.com", icon: "fa-child-reaching", bg: "bg-purple-600" }
    ];

    let currentUser = null;
    let currentChatType = 'direct';
    let currentRecipientEmail = null;
    let currentGroupId = null;
    let onlineUsersMap = new Map();
    let allLoadedMessages = [];
    let customGroups = JSON.parse(localStorage.getItem('safetalk_custom_groups') || '[]');

    function encryptText(text) {
      if (!text || text.startsWith('http') || text.startsWith('data:audio') || text.startsWith('DOC:')) return text;
      try {
        const encoded = encodeURIComponent(text);
        return "ENC:" + btoa(encoded.split('').map((c, i) => 
          String.fromCharCode(c.charCodeAt(0) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length))
        ).join(''));
      } catch (e) { return text; }
    }

    function decryptText(cipherText) {
      if (!cipherText || !cipherText.startsWith("ENC:")) return cipherText;
      try {
        const rawCipher = cipherText.replace("ENC:", "");
        const decodedXor = atob(rawCipher).split('').map((c, i) => 
          String.fromCharCode(c.charCodeAt(0) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length))
        ).join('');
        return decodeURIComponent(decodedXor);
      } catch(e) { return cipherText; }
    }

    async function initPresenceTracking() {
      const presenceChannel = supabaseClient.channel('online-users');

      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          const state = presenceChannel.presenceState();
          onlineUsersMap.clear();
          Object.keys(state).forEach(key => {
            const presences = state[key];
            if (presences && presences.length > 0) {
              presences.forEach(user => onlineUsersMap.set(user.email, true));
            }
          });
          renderConversationsList();
          updateHeaderPresence();
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED' && currentUser) {
            await presenceChannel.track({ email: currentUser.email, online_at: new Date().toISOString() });
          }
        });
    }

    function updateHeaderPresence() {
      if (currentChatType === 'direct' && currentRecipientEmail) {
        const isOnline = onlineUsersMap.has(currentRecipientEmail);
        document.getElementById('activeChatSub').innerText = isOnline ? "🟢 Online now" : "Offline";
      }
    }

    function renderConversationsList(filter = '') {
      const container = document.getElementById('conversationsContainer');
      if (!container) return;
      container.innerHTML = '';

      familyMembers.forEach(member => {
        if (member.email !== currentUser.email && (!filter || member.name.toLowerCase().includes(filter.toLowerCase()))) {
          const isOnline = onlineUsersMap.has(member.email);
          const div = document.createElement('div');
          div.className = `p-3.5 hover:bg-slate-50 cursor-pointer transition flex items-center space-x-3`;
          div.onclick = () => openChatRoom('direct', member.email, member.name, member.bg, member.icon);
          div.innerHTML = `
            <div class="w-11 h-11 rounded-full ${member.bg} flex items-center justify-center text-white font-bold shrink-0 shadow-sm relative">
              <i class="fas ${member.icon}"></i>
              <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-white ${isOnline ? 'bg-emerald-500' : 'bg-slate-300'}" title="${isOnline ? 'Online' : 'Offline'}"></span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-slate-800 font-semibold flex justify-between items-center">
                <span>${member.name}</span>
                <span class="text-[10px] ${isOnline ? 'text-emerald-600 font-bold' : 'text-slate-400'}">${isOnline ? 'Online' : 'Offline'}</span>
              </div>
              <div class="text-slate-500 truncate text-xs">Tap to chat</div>
            </div>
          `;
          container.appendChild(div);
        }
      });
    }

    function renderSingleMessage(msg) {
      const chatContainer = document.getElementById('chatMessages');
      const isMe = msg.sender_email === currentUser.email;

      const isDoc = msg.message_text.startsWith('DOC:');
      const isImage = !isDoc && (msg.message_text.startsWith('http://') || msg.message_text.startsWith('https://')) && (msg.message_text.includes('.jpg') || msg.message_text.includes('.png') || msg.message_text.includes('.jpeg'));
      const isVoice = !isDoc && (msg.message_text.startsWith('data:audio') || msg.message_text.includes('.webm') || msg.message_text.includes('.mp3'));

      let displayText = (isImage || isVoice || isDoc) ? msg.message_text : decryptText(msg.message_text);

      let readReceiptHtml = '';
      if (isMe) {
        if (msg.is_read) {
          readReceiptHtml = '<span class="text-sky-300 font-bold text-xs ml-1" title="Read">✓✓</span>';
        } else {
          readReceiptHtml = '<span class="text-slate-300 text-xs ml-1" title="Sent">✓</span>';
        }
      }

      let contentHtml = '';
      if (isDoc) {
        const parts = displayText.replace('DOC:', '').split('|');
        contentHtml = `
          <a href="${parts[1]}" target="_blank" download="${parts[0]}" class="flex items-center space-x-2 p-2 bg-slate-50/20 rounded-xl hover:bg-slate-50/40 transition">
            <i class="fas fa-file-pdf text-red-400 text-xl"></i>
            <div class="min-w-0">
              <div class="font-bold text-xs truncate max-w-[160px]">${parts[0]}</div>
              <div class="text-[10px] opacity-75">Download document</div>
            </div>
          </a>`;
      } else if (isVoice) {
        contentHtml = `<audio controls src="${displayText}" class="h-8 max-w-[180px]"></audio>`;
      } else if (isImage) {
        contentHtml = `<img src="${displayText}" class="rounded-xl max-w-xs max-h-64 object-cover shadow">`;
      } else {
        contentHtml = formatTextWithLinkPreviews(displayText);
      }

      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;
      wrapper.innerHTML = `
        <div class="max-w-[85%] px-3.5 py-2.5 rounded-2xl shadow-sm ${isMe ? 'chat-bubble-me' : 'chat-bubble-them'}">
          ${contentHtml}
          <div class="text-[9px] text-right mt-1 opacity-75 flex items-center justify-end space-x-1">
            <span>${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            ${readReceiptHtml}
          </div>
        </div>
      `;
      chatContainer.appendChild(wrapper);
    }

    function formatTextWithLinkPreviews(text) {
      const youtubeMatch = text.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (youtubeMatch && youtubeMatch[1]) {
        const embedUrl = `https://www.youtube.com/embed/${youtubeMatch[1]}`;
        return `
          <div>${text}</div>
          <div class="mt-2 rounded-xl overflow-hidden border border-slate-300 bg-black">
            <iframe class="w-full h-44" src="${embedUrl}" frameborder="0" allowfullscreen></iframe>
          </div>
        `;
      }

      const urlRegex = /(https?:\/\/[^\s]+)/g;
      if (urlRegex.test(text)) {
        const targetUrl = text.match(urlRegex)[0];
        const previewId = `prev_${Math.random().toString(36).substr(2, 9)}`;
        fetchLinkPreview(targetUrl, previewId);

        return `
          <div>${text.replace(urlRegex, `<a href="$1" target="_blank" class="underline font-bold">$1</a>`)}</div>
          <div id="${previewId}" class="mt-2 p-2 bg-slate-800/30 rounded-xl border border-slate-600/40 text-xs">
            <i class="fas fa-spinner fa-spin text-emerald-300"></i> Loading link preview...
          </div>
        `;
      }

      return text;
    }

    async function fetchLinkPreview(url, elementId) {
      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
        const json = await res.json();
        const container = document.getElementById(elementId);
        if (container && json.status === 'success' && json.data) {
          const { title, description, image } = json.data;
          container.innerHTML = `
            <a href="${url}" target="_blank" class="block hover:opacity-90">
              ${image ? `<img src="${image.url}" class="w-full h-24 object-cover rounded-lg mb-1">` : ''}
              <div class="font-bold text-emerald-300 truncate">${title || url}</div>
              ${description ? `<div class="text-[10px] opacity-80 line-clamp-2">${description}</div>` : ''}
            </a>
          `;
        }
      } catch(e) {}
    }

    async function markMessagesAsRead() {
      if (currentChatType === 'direct' && currentRecipientEmail) {
        await supabaseClient
          .from('messages')
          .update({ is_read: true })
          .eq('sender_email', currentRecipientEmail)
          .eq('recipient_email', currentUser.email)
          .eq('is_read', false);
      }
    }

    async function openChatRoom(type, identifier, name, bgClass, iconClass) {
      currentChatType = type;
      currentRecipientEmail = identifier;
      document.getElementById('activeChatTitle').innerText = name;
      document.getElementById('chatsListScreen').classList.add('hidden', 'md:flex');
      document.getElementById('chatRoomScreen').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      updateHeaderPresence();
      await markMessagesAsRead();
      loadMessagesFromCloud();
    }
  </script>
</body>
