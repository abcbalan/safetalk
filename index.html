    function encryptText(text) {
      if (!text || text.startsWith('http') || text.startsWith('data:audio') || text.startsWith('DOC:')) return text;
      try {
        const encoded = encodeURIComponent(text);
        return "ENC:" + btoa(encoded.split('').map((c, i) => 
          String.fromCharCode(c.charCodeAt(0) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length))
        ).join(''));
      } catch (e) { return text; }
    }

    function decryptText(cipherText) {
      if (!cipherText || !cipherText.startsWith("ENC:")) return cipherText;
      try {
        const rawCipher = cipherText.replace("ENC:", "");
        const decodedXor = atob(rawCipher).split('').map((c, i) => 
          String.fromCharCode(c.charCodeAt(0) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length))
        ).join('');
        return decodeURIComponent(decodedXor);
      } catch(e) { return cipherText; }
    }

    async function initApp() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        document.getElementById('customLoginModal').classList.remove('hidden');
      } else {
        currentUser = session.user;
        postLoginInit();
      }
    }

    async function submitCustomLogin() {
      const email = document.getElementById('loginEmailInput').value.trim();
      const password = document.getElementById('loginPasswordInput').value.trim();
      const errDiv = document.getElementById('loginErrorMsg');
      errDiv.classList.add('hidden');

      if (!email || !password) {
        errDiv.innerText = "Please enter email and password.";
        errDiv.classList.remove('hidden');
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errDiv.innerText = "Login failed: " + error.message;
        errDiv.classList.remove('hidden');
        return;
      }

      currentUser = data.user;
      document.getElementById('customLoginModal').classList.add('hidden');
      postLoginInit();
    }

    function setupUserInterface() {
      const member = familyMembers.find(m => m.email === currentUser.email) || { name: currentUser.email.split('@')[0], icon: "fa-user", bg: "bg-emerald-600" };

    function renderConversationsList(filter = '') {
      const container = document.getElementById('conversationsContainer');

      container.innerHTML = '';

      customGroups.forEach(grp => {
        if (!filter || grp.name.toLowerCase().includes(filter.toLowerCase())) {

          div.className = `p-3.5 hover:bg-slate-50 cursor-pointer transition flex items-center justify-between space-x-3`;
          div.onclick = () => openChatRoom('group', grp.id, grp.name, 'bg-emerald-700', 'fa-users');
          div.innerHTML = `
            <div class="flex items-center space-x-3 min-w-0">
              <div class="w-11 h-11 rounded-full bg-emerald-700 flex items-center justify-center text-white font-bold shrink-0 shadow-sm">

              </div>

                <div class="text-slate-800 font-semibold truncate">${grp.name}</div>
                <div class="text-slate-500 text-xs truncate">Group Chat</div>
              </div>
            </div>
          `;
          container.appendChild(div);
        }
      });

      familyMembers.forEach(member => {
        if (member.email !== currentUser.email && (!filter || member.name.toLowerCase().includes(filter.toLowerCase()))) {
          const isOnline = onlineUsersMap.has(member.email);
          const div = document.createElement('div');
          div.className = `p-3.5 hover:bg-slate-50 cursor-pointer transition flex items-center space-x-3`;
          div.onclick = () => openChatRoom('direct', member.email, member.name, member.bg, member.icon);
          div.innerHTML = `
            <div class="w-11 h-11 rounded-full ${member.bg} flex items-center justify-center text-white font-bold shrink-0 shadow-sm relative">
              <i class="fas ${member.icon}"></i>
              <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-white ${isOnline ? 'bg-emerald-500' : 'bg-slate-300'}" title="${isOnline ? 'Online' : 'Offline'}"></span>

            <div class="flex-1 min-w-0">
              <div class="text-slate-800 font-semibold flex justify-between items-center">
                <span>${member.name}</span>
                <span class="text-[10px] ${isOnline ? 'text-emerald-600 font-bold' : 'text-slate-400'}">${isOnline ? 'Online' : 'Offline'}</span>

    function filterChatList(query) {
      renderConversationsList(query);
    }

    async function initPresenceTracking() {
      const presenceChannel = supabaseClient.channel('online-users');
      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          const state = presenceChannel.presenceState();
          onlineUsersMap.clear();
          Object.keys(state).forEach(key => {
            const presences = state[key];
            if (presences) {
              presences.forEach(user => onlineUsersMap.set(user.email, true));
            }
          });
          renderConversationsList();
          updateHeaderPresence();
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED' && currentUser) {
            await presenceChannel.track({ email: currentUser.email, online_at: new Date().toISOString() });
          }
        });
    }

    function updateHeaderPresence() {
      if (currentChatType === 'direct' && currentRecipientEmail) {
        const isOnline = onlineUsersMap.has(currentRecipientEmail);
        document.getElementById('activeChatSub').innerText = isOnline ? "🟢 Online now" : "Offline";
      }
    }

    function openChatRoom(type, identifier, name, bgClass, iconClass) {
      currentChatType = type;
      if (type === 'group') {
        currentGroupId = identifier;
        currentRecipientEmail = null;
      } else {
        currentRecipientEmail = identifier;
        currentGroupId = null;

      document.getElementById('activeChatTitle').innerText = name;
      document.getElementById('activeChatSub').innerText = type === 'group' ? "Custom Group Chat" : "Direct Message";
      document.getElementById('chatsListScreen').classList.add('hidden', 'md:flex');
      document.getElementById('chatRoomScreen').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      updateHeaderPresence();
      markMessagesAsRead();
      filterAndRenderMessages(true);

      document.getElementById('activeChatSub').innerText = "Select a conversation to start";

    async function loadMessagesFromCloud() {
      const { data, error } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
      if (!error && data) {
        allLoadedMessages = data;
        filterAndRenderMessages(true);
      }
    }

    function startRealtimeSubscription() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
          if (payload.eventType === 'INSERT') {
            allLoadedMessages.push(payload.new);
            filterAndRenderMessages(true);
          } else if (payload.eventType === 'DELETE') {
            allLoadedMessages = allLoadedMessages.filter(m => m.id !== payload.old.id);
            filterAndRenderMessages(false);
          }
        })
        .subscribe();
    }

    function computeExpiryTimestamp() {
      const retentionVal = document.getElementById('retentionSelect').value;
      if (retentionVal === 'forever') return null;
      const now = Date.now();
      if (retentionVal === '1m') return new Date(now + 60 * 1000).toISOString();
      if (retentionVal === '8h') return new Date(now + 8 * 60 * 60 * 1000).toISOString();
      if (retentionVal === '7d') return new Date(now + 7 * 24 * 60 * 60 * 1000).toISOString();
      return null;
    }

    function filterAndRenderMessages(forceScroll = false) {
      const chatContainer = document.getElementById('chatMessages');
      if (!chatContainer) return;
      chatContainer.innerHTML = '';

      const nowMs = Date.now();
      const validMsgs = allLoadedMessages.filter(msg => {
        if (deletedMessageIds.includes(msg.id)) return false;
        
        if (currentChatType === 'group') {
          if (msg.group_id !== currentGroupId) return false;
        } else {
          const isRelevantDirect = 
            (msg.sender_email === currentUser.email && msg.recipient_email === currentRecipientEmail) ||
            (msg.sender_email === currentRecipientEmail && msg.recipient_email === currentUser.email);
          if (!isRelevantDirect) return false;
        }

        if (msg.expires_at) {
          const expiryMs = new Date(msg.expires_at).getTime();
          if (!isNaN(expiryMs) && expiryMs <= nowMs) return false;
        }
        return true;
      });

      validMsgs.forEach(msg => renderSingleMessage(msg));
      if (forceScroll) chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderSingleMessage(msg) {
      const chatContainer = document.getElementById('chatMessages');
      const isMe = msg.sender_email === currentUser.email;
      const isOfflinePending = msg.id && msg.id.toString().startsWith('offline_');

      const isDoc = msg.message_text.startsWith('DOC:');
      const isImage = !isDoc && (msg.message_text.startsWith('http://') || msg.message_text.startsWith('https://')) && !msg.message_text.includes('.webm');
      const isVoice = !isDoc && (msg.message_text.startsWith('data:audio') || msg.message_text.includes('.webm') || msg.message_text.includes('.mp3'));

      let displayText = (isImage || isVoice || isDoc) ? msg.message_text : decryptText(msg.message_text);

      let readReceiptHtml = '';
      if (isMe) {
        readReceiptHtml = msg.is_read ? '<span class="text-sky-300 font-bold text-xs ml-1">✓✓</span>' : '<span class="text-slate-300 text-xs ml-1">✓</span>';
      }

      let contentHtml = '';
      if (isDoc) {
        const parts = displayText.replace('DOC:', '').split('|');
        contentHtml = `
          <a href="${parts[1]}" target="_blank" download="${parts[0]}" class="flex items-center space-x-2 p-2 bg-slate-50/20 rounded-xl hover:bg-slate-50/40 transition">
            <i class="fas fa-file-pdf text-red-400 text-xl"></i>
            <div class="min-w-0">
              <div class="font-bold text-xs truncate max-w-[160px]">${parts[0]}</div>
              <div class="text-[10px] opacity-75">Download document</div>
            </div>
          </a>`;
      } else if (isImage) {
        contentHtml = `<img src="${displayText}" class="rounded-xl max-w-xs max-h-64 object-cover shadow">`;
      } else if (isVoice) {
        contentHtml = `<audio controls src="${displayText}" class="h-8 max-w-[180px]"></audio>`;
      } else {
        contentHtml = formatTextWithLinkPreviews(displayText);
      }

      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;

      const bubbleEl = document.createElement('div');
      bubbleEl.className = `max-w-[85%] px-3.5 py-2.5 rounded-2xl shadow-sm cursor-pointer ${isOfflinePending ? 'chat-bubble-me-pending' : (isMe ? 'chat-bubble-me' : 'chat-bubble-them')}`;
      bubbleEl.innerHTML = contentHtml;

      // Click & Hold or Right Click for Action Menu
      let pressTimer = null;
      const triggerActionMenu = (e) => { e.preventDefault(); openActionMenu(msg.id, isMe); };
      bubbleEl.addEventListener('mousedown', (e) => { if (e.button === 2) { triggerActionMenu(e); return; } pressTimer = setTimeout(() => triggerActionMenu(e), 500); });
      bubbleEl.addEventListener('mouseup', () => clearTimeout(pressTimer));
      bubbleEl.addEventListener('touchstart', () => { pressTimer = setTimeout(() => triggerActionMenu(event), 500); }, { passive: true });
      bubbleEl.addEventListener('touchend', () => clearTimeout(pressTimer));
      bubbleEl.addEventListener('contextmenu', (e) => e.preventDefault());

      wrapper.innerHTML = `<span class="text-slate-400 text-[10px] mb-0.5 px-1">${isMe ? 'You' : msg.sender_name}</span>`;
      wrapper.appendChild(bubbleEl);
      chatContainer.appendChild(wrapper);
    }

    function openActionMenu(msgId, isMe) {
      activeSelectedMsgId = msgId;
      const deleteEveryoneBtn = document.getElementById('deleteEveryoneBtn');
      const editBtn = document.getElementById('editMessageBtn');

      if (isMe) {
        deleteEveryoneBtn.classList.remove('hidden'); deleteEveryoneBtn.classList.add('flex');
        editBtn.classList.remove('hidden'); editBtn.classList.add('flex');
      } else {
        deleteEveryoneBtn.classList.add('hidden'); deleteEveryoneBtn.classList.remove('flex');
        editBtn.classList.add('hidden'); editBtn.classList.remove('flex');
      }
      document.getElementById('actionMenuModal').classList.remove('hidden');
    }

    function closeActionMenu() {
      document.getElementById('actionMenuModal').classList.add('hidden');
      activeSelectedMsgId = null;
    }

    function copyActiveMessage() {
      const msg = allLoadedMessages.find(m => m.id === activeSelectedMsgId);
      if (msg) navigator.clipboard.writeText(decryptText(msg.message_text));
      closeActionMenu();
    }

    function prepareEditActiveMessage() {
      const msg = allLoadedMessages.find(m => m.id === activeSelectedMsgId);
      if (msg) {
        editingMessageId = activeSelectedMsgId;
        document.getElementById('messageInput').value = decryptText(msg.message_text);
        document.getElementById('messageInput').focus();
        document.getElementById('sendSubmitBtn').innerHTML = '<i class="fas fa-check text-xs"></i>';
      }
      closeActionMenu();
    }

    async function deleteActiveMessage(scope) {
      if (!activeSelectedMsgId) return;
      const msgId = activeSelectedMsgId;
      closeActionMenu();

      deletedMessageIds.push(msgId);
      allLoadedMessages = allLoadedMessages.filter(m => m.id !== msgId);
      filterAndRenderMessages(false);

      if (scope === 'everyone' && navigator.onLine) {
        await supabaseClient.from('messages').delete().eq('id', msgId);
      }
    }

    function formatTextWithLinkPreviews(text) {
      const youtubeMatch = text.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (youtubeMatch && youtubeMatch[1]) {
        return `
          <div>${text}</div>
          <div class="mt-2 rounded-xl overflow-hidden border border-slate-300 bg-black">
            <iframe class="w-full h-44" src="https://www.youtube.com/embed/${youtubeMatch[1]}" frameborder="0" allowfullscreen></iframe>
          </div>
        `;
      }
      return `<div>${text}</div>`;
    }

    async function handleMessageSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const cipherText = encryptText(text);

      if (editingMessageId) {
        const msgId = editingMessageId;
        editingMessageId = null;
        document.getElementById('sendSubmitBtn').innerHTML = '<i class="fas fa-paper-plane text-xs"></i>';
        const msgObj = allLoadedMessages.find(m => m.id === msgId);
        if (msgObj) {
          msgObj.message_text = cipherText;
          filterAndRenderMessages(false);
          if (navigator.onLine) await supabaseClient.from('messages').update({ message_text: cipherText }).eq('id', msgId);
        }
        return;
      }

      const newMessage = {
        sender_email: currentUser.email,
        sender_name: familyMembers.find(m => m.email === currentUser.email)?.name || currentUser.email.split('@')[0],
        message_text: cipherText,
        channel_type: currentChatType,
        recipient_email: currentRecipientEmail,
        group_id: currentGroupId,
        expires_at: computeExpiryTimestamp(),
        is_read: false,
        created_at: new Date().toISOString()
      };

      if (navigator.onLine) {
        const { data, error } = await supabaseClient.from('messages').insert([newMessage]).select();
        if (!error && data && data[0]) {
          allLoadedMessages.push(data[0]);
          filterAndRenderMessages(true);
          return;
        }
      }

      // Offline handling
      newMessage.id = 'offline_' + Date.now();
      allLoadedMessages.push(newMessage);
      filterAndRenderMessages(true);
      queueOfflineMessage(newMessage);
    }

    function queueOfflineMessage(msg) {
      let queue = JSON.parse(localStorage.getItem('safetalk_offline_queue') || '[]');
      queue.push(msg);
      localStorage.setItem('safetalk_offline_queue', JSON.stringify(queue));
      updateSyncStatus(false);
    }

    async function processOfflineQueue() {
      if (!navigator.onLine) return;
      let queue = JSON.parse(localStorage.getItem('safetalk_offline_queue') || '[]');
      if (queue.length === 0) { updateSyncStatus(true); return; }

      for (let msg of queue) {
        const cleanMsg = { ...msg };
        delete cleanMsg.id;
        await supabaseClient.from('messages').insert([cleanMsg]);
      }
      localStorage.removeItem('safetalk_offline_queue');
      updateSyncStatus(true);
      loadMessagesFromCloud();
    }

    function setupNetworkListener() {
      window.addEventListener('online', () => { updateSyncStatus(true); processOfflineQueue(); });
      window.addEventListener('offline', () => updateSyncStatus(false));
    }

    function updateSyncStatus(isOnline) {
      const ind = document.getElementById('syncStatusIndicator');
      ind.className = `w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse'}`;
    }

    async function toggleVoiceRecording() {
      const bar = document.getElementById('voiceRecordingBar');
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopAndSendVoice();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.start();
        bar.classList.remove('hidden');
      } catch (err) {}
    }

    function stopAndSendVoice() {
      if (!mediaRecorder) return;
      mediaRecorder.stop();
      document.getElementById('voiceRecordingBar').classList.add('hidden');
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
          const base64Audio = reader.result;
          const newMessage = {
            sender_email: currentUser.email,
            sender_name: familyMembers.find(m => m.email === currentUser.email)?.name || currentUser.email.split('@')[0],
            message_text: base64Audio,
            channel_type: currentChatType,
            recipient_email: currentRecipientEmail,
            group_id: currentGroupId,
            expires_at: computeExpiryTimestamp(),
            is_read: false,
            created_at: new Date().toISOString()
          };
          const { data } = await supabaseClient.from('messages').insert([newMessage]).select();
          if (data && data[0]) { allLoadedMessages.push(data[0]); filterAndRenderMessages(true); }
        };
      };
    }

    function openGroupCreateModal() {
      const container = document.getElementById('groupMembersSelector');
      container.innerHTML = '';
      familyMembers.forEach(m => {
        if (m.email !== currentUser.email) {
          container.innerHTML += `<label class="flex items-center space-x-2"><input type="checkbox" value="${m.email}" class="group-member-checkbox"><span>${m.name}</span></label>`;
        }
      });
      document.getElementById('createGroupModal').classList.remove('hidden');
    }
    function closeGroupModal() { document.getElementById('createGroupModal').classList.add('hidden'); }
    function confirmCreateGroup() {
      const name = document.getElementById('groupNameInput').value.trim();
      if (!name) return;
      const checked = Array.from(document.querySelectorAll('.group-member-checkbox:checked')).map(c => c.value);
      checked.push(currentUser.email);
      customGroups.push({ id: 'grp_' + Date.now(), name, members: checked });
      localStorage.setItem('safetalk_custom_groups', JSON.stringify(customGroups));
      closeGroupModal();
      renderConversationsList();
    }

    function switchEmojiTab(tabKey) {
      const grid = document.getElementById('emojiGrid');
      grid.innerHTML = '';
      (emojiCategories[tabKey] || []).forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'hover:scale-125 transition transform p-1';
        btn.innerText = emoji;
        btn.onclick = () => { document.getElementById('messageInput').value += emoji; };
        grid.appendChild(btn);
      });
    }
    function toggleEmojiPicker() { document.getElementById('emojiPicker').classList.toggle('hidden'); }

    async function handleImageSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fileName = `safetalk_${Date.now()}.jpg`;
      await supabaseClient.storage.from('car-photos').upload(`car-photos/${fileName}`, file);
      const { data } = supabaseClient.storage.from('car-photos').getPublicUrl(`car-photos/${fileName}`);
      await supabaseClient.from('messages').insert([{ sender_email: currentUser.email, message_text: data.publicUrl, recipient_email: currentRecipientEmail, group_id: currentGroupId, channel_type: currentChatType, is_read: false, created_at: new Date().toISOString() }]);
      loadMessagesFromCloud();
    }

    async function handleDocSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fileName = `doc_${Date.now()}_${file.name}`;
      await supabaseClient.storage.from('car-photos').upload(`documents/${fileName}`, file);
      const { data } = supabaseClient.storage.from('car-photos').getPublicUrl(`documents/${fileName}`);
      await supabaseClient.from('messages').insert([{ sender_email: currentUser.email, message_text: `DOC:${file.name}|${data.publicUrl}`, recipient_email: currentRecipientEmail, group_id: currentGroupId, channel_type: currentChatType, is_read: false, created_at: new Date().toISOString() }]);
      loadMessagesFromCloud();
    }

    async function markMessagesAsRead() {
      if (currentRecipientEmail) {
        await supabaseClient.from('messages').update({ is_read: true }).eq('sender_email', currentRecipientEmail).eq('recipient_email', currentUser.email).eq('is_read', false);
      }
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
