<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .chat-bubble-me { background: #15803d; color: white; border-bottom-right-radius: 4px; word-break: break-word; }
    .chat-bubble-them { background: #ffffff; color: #0f172a; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; word-break: break-word; }
    
    body.text-sm-custom { font-size: 0.875rem; }
    body.text-lg-custom { font-size: 1rem; }
    body.text-xl-custom { font-size: 1.15rem; }

    .animated-emoji {
      display: inline-block;
      animation: emojiBounce 2s infinite ease-in-out;
    }
    @keyframes emojiBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.1); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>

          <i class="fas fa-plus"></i>

        <button onclick="confirmCreateGroup()" class="flex-1 py-2.5 bg-emerald-700 text-white font-bold rounded-xl shadow text-xs">Create Group</button>

      <div class="flex gap-2 w-full">
        <button onclick="closeImageModal()" class="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Cancel</button>
        <button onclick="confirmAndSendImage()" id="sendImageBtn" class="flex-1 py-2.5 bg-emerald-700 text-white font-bold rounded-xl shadow text-xs">Send Photo</button>

    function encryptText(text) {
      if (text.startsWith('http') || text.startsWith('data:audio')) return text;
      try {
        const encoded = encodeURIComponent(text);
        return "ENC:" + btoa(encoded.split('').map((c, i) => 
          String.fromCharCode(c.charCodeAt(0) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length))
        ).join(''));
      } catch (e) {
        return text;
      }
    }

    function decryptText(cipherText) {
      if (!cipherText.startsWith("ENC:")) return cipherText;
      try {
        const rawCipher = cipherText.replace("ENC:", "");
        const decodedXor = atob(rawCipher).split('').map((c, i) => 
          String.fromCharCode(c.charCodeAt(0) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length))
        ).join('');
        return decodeURIComponent(decodedXor);
      } catch(e) {
        return cipherText;
      }
    }

    async function initApp() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        const email = prompt("Enter your SafeTalk email (mum@family.com, dad@family.com, alex@family.com, sarah@family.com):", "dad@family.com");
        if (!email) return;
        const password = prompt("Enter your password:", "123456");
        if (!password) return;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { alert("Login failed: " + error.message); location.reload(); return; }
        currentUser = data.user;
      } else {
        currentUser = session.user;
      }

      setupUserInterface();
      renderConversationsList();
      startPollingEngine();
      setupNetworkListener();
      processOfflineQueue();
      switchEmojiTab('smileys');
      startCountdownTimerEngine();
    }

    function setupUserInterface() {
      const member = familyMembers.find(m => m.email === currentUser.email) || { name: currentUser.email.split('@')[0], icon: "fa-user", bg: "bg-emerald-600" };
      document.getElementById('currentUserBadge').innerText = `👤 ${member.name}`;
      document.getElementById('headerAvatar').innerHTML = `<i class="fas ${member.icon}"></i>`;
      document.getElementById('headerAvatar').className = `w-9 h-9 rounded-full ${member.bg} flex items-center justify-center font-bold text-white shadow border border-emerald-500 shrink-0`;
    }

    function renderConversationsList(filter = '') {
      const container = document.getElementById('conversationsContainer');
      container.innerHTML = '';

      customGroups.forEach(grp => {
        if (!filter || grp.name.toLowerCase().includes(filter.toLowerCase())) {
          const div = document.createElement('div');
          const isUnread = (unreadCounts[grp.id] || 0) > 0;
          div.className = `p-3.5 hover:bg-slate-50 cursor-pointer transition flex items-center space-x-3 ${isUnread ? 'bg-emerald-50/60 font-bold' : ''}`;
          div.onclick = () => openChatRoom('group', grp.id, grp.name, 'bg-emerald-700', 'fa-users');
          div.innerHTML = `
            <div class="w-11 h-11 rounded-full bg-emerald-700 flex items-center justify-center text-white font-bold shrink-0 shadow-sm relative">
              <i class="fas fa-users"></i>
              ${isUnread ? `<span class="absolute -top-1 -right-1 bg-red-500 text-white w-4 h-4 rounded-full flex items-center justify-center font-bold" style="font-size: 0.7em;">${unreadCounts[grp.id]}</span>` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-slate-800 truncate ${isUnread ? 'font-bold' : 'font-semibold'}">${grp.name}</div>
              <div class="text-slate-500 truncate" style="font-size: 0.8em;">Admin: ${grp.admin}</div>
            </div>
          `;
          container.appendChild(div);
        }
      });

      familyMembers.forEach(member => {
        if (member.email !== currentUser.email && (!filter || member.name.toLowerCase().includes(filter.toLowerCase()))) {
          const div = document.createElement('div');
          const isUnread = (unreadCounts[member.email] || 0) > 0;
          div.className = `p-3.5 hover:bg-slate-50 cursor-pointer transition flex items-center space-x-3 ${isUnread ? 'bg-emerald-50/60 font-bold' : ''}`;
          div.onclick = () => openChatRoom('direct', member.email, member.name, member.bg, member.icon);
          div.innerHTML = `
            <div class="w-11 h-11 rounded-full ${member.bg} flex items-center justify-center text-white font-bold shrink-0 shadow-sm relative">
              <i class="fas ${member.icon}"></i>
              ${isUnread ? `<span class="absolute -top-1 -right-1 bg-red-500 text-white w-4 h-4 rounded-full flex items-center justify-center font-bold" style="font-size: 0.7em;">${unreadCounts[member.email]}</span>` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-slate-800 truncate ${isUnread ? 'font-bold' : 'font-semibold'}">${member.name}</div>

    function filterChatList(query) {
      renderConversationsList(query);
    }

    function openChatRoom(type, identifier, name, bgClass, iconClass) {
      currentChatType = type;
      if (type === 'group') {
        currentGroupId = identifier;
        currentRecipientEmail = null;
        unreadCounts[identifier] = 0;
      } else {
        currentRecipientEmail = identifier;
        currentGroupId = null;
        unreadCounts[identifier] = 0;
      }
      localStorage.setItem('safetalk_unread', JSON.stringify(unreadCounts));
      updateAppBadge();

      document.getElementById('activeChatTitle').innerText = name;
      document.getElementById('activeChatSub').innerText = type === 'group' ? "Custom Group Chat" : "Direct Message";
      document.getElementById('headerAvatar').innerHTML = `<i class="fas ${iconClass}"></i>`;
      document.getElementById('headerAvatar').className = `w-9 h-9 rounded-full ${bgClass} flex items-center justify-center font-bold text-white shadow border border-emerald-500 shrink-0`;

      document.getElementById('chatsListScreen').classList.add('hidden', 'md:flex');
      document.getElementById('chatRoomScreen').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');

      loadMessagesFromCloud();
    }

    function returnToChatList() {
      document.getElementById('chatsListScreen').classList.remove('hidden', 'md:flex');
      document.getElementById('chatRoomScreen').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');

      document.getElementById('activeChatTitle').innerText = "SafeTalk Chats";
      document.getElementById('activeChatSub').innerText = "Select a conversation to start";
      setupUserInterface();
      renderConversationsList();
    }

    function getGlobalCacheKey() {
      return `safetalk_global_messages_v4`;
    }

    function saveGlobalCache() {
      try {
        localStorage.setItem(getGlobalCacheKey(), JSON.stringify(allLoadedMessages));
      } catch(e) {}
    }

    async function loadMessagesFromCloud() {
      const chatContainer = document.getElementById('chatMessages');
      
      const cached = JSON.parse(localStorage.getItem(getGlobalCacheKey()) || '[]');
      if (cached.length > 0) {
        allLoadedMessages = cached;
        filterAndRenderMessages();
      } else {
        chatContainer.innerHTML = '<div class="text-center text-slate-400 py-4"><i class="fas fa-spinner fa-spin mr-1"></i> Loading messages...</div>';
      }

      if (!navigator.onLine) return;

      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (!error && data) {
        // Merge without dropping local unsynced messages
        const existingMap = new Map(allLoadedMessages.map(m => [m.id, m]));
        data.forEach(m => existingMap.set(m.id, m));
        allLoadedMessages = Array.from(existingMap.values());
        saveGlobalCache();
        filterAndRenderMessages();
      }
    }

    function startPollingEngine() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!navigator.onLine) return;
        const { data, error } = await supabaseClient
          .from('messages')
          .select('*')
          .order('created_at', { ascending: true });

        if (!error && data) {
          const existingMap = new Map(allLoadedMessages.map(m => [m.id, m]));
          data.forEach(m => existingMap.set(m.id, m));
          allLoadedMessages = Array.from(existingMap.values());
          saveGlobalCache();
          
          if (!document.getElementById('chatRoomScreen').classList.contains('hidden')) {
            filterAndRenderMessages();
          }
        }
      }, 2500);
    }

    function filterAndRenderMessages() {
      const nowMs = Date.now();
      const validMsgs = allLoadedMessages.filter(msg => {
        if (deletedMessageIds.includes(msg.id)) return false;
        
        if (currentChatType === 'group') {
          if (msg.group_id !== currentGroupId) return false;
        } else {
          const isRelevantDirect = 
            (msg.sender_email === currentUser.email && msg.recipient_email === currentRecipientEmail) ||
            (msg.sender_email === currentRecipientEmail && msg.recipient_email === currentUser.email);
          if (!isRelevantDirect) return false;
        }

        if (msg.expires_at) {
          const expiryMs = new Date(msg.expires_at).getTime();
          if (!isNaN(expiryMs) && expiryMs <= nowMs) return false;
        }
        return true;
      });
      renderFilteredMessages(validMsgs);
    }

    function filterMessageHistory() {
      const query = (document.getElementById('historySearchInput').value || '').toLowerCase();
      const nowMs = Date.now();
      const validMsgs = allLoadedMessages.filter(msg => {
        if (deletedMessageIds.includes(msg.id)) return false;
        if (currentChatType === 'group') {
          if (msg.group_id !== currentGroupId) return false;
        } else {
          const isRelevantDirect = 
            (msg.sender_email === currentUser.email && msg.recipient_email === currentRecipientEmail) ||
            (msg.sender_email === currentRecipientEmail && msg.recipient_email === currentUser.email);
          if (!isRelevantDirect) return false;
        }
        if (msg.expires_at) {
          const expiryMs = new Date(msg.expires_at).getTime();
          if (!isNaN(expiryMs) && expiryMs <= nowMs) return false;
        }
        return true;
      });

      if (!query) {
        renderFilteredMessages(validMsgs);
        return;
      }
      const filtered = validMsgs.filter(msg => {
        const text = msg.message_text.startsWith('http') || msg.message_text.startsWith('data:audio') ? '' : decryptText(msg.message_text).toLowerCase();
        return text.includes(query) || msg.sender_name.toLowerCase().includes(query);
      });
      renderFilteredMessages(filtered);
    }

    function renderFilteredMessages(messages) {
      const chatContainer = document.getElementById('chatMessages');
      chatContainer.innerHTML = '';
      messages.forEach(msg => renderSingleMessage(msg));
      scrollToBottom();
    }

    function computeExpiryTimestamp() {
      const retentionVal = document.getElementById('retentionSelect').value;
      if (retentionVal === 'forever') return null;
      const now = Date.now();
      if (retentionVal === '1m') return new Date(now + 60 * 1000).toISOString();
      if (retentionVal === '8h') return new Date(now + 8 * 60 * 60 * 1000).toISOString();
      if (retentionVal === '7d') return new Date(now + 7 * 24 * 60 * 60 * 1000).toISOString();
      return null;
    }

    function getRemainingTimeStr(expiresAt) {
      if (!expiresAt) return '';
      const diff = new Date(expiresAt).getTime() - Date.now();
      if (diff <= 0) return 'Expired';
      const secs = Math.floor(diff / 1000);
      if (secs < 60) return `${secs}s left`;
      const mins = Math.floor(secs / 60);
      if (mins < 60) return `${mins}m left`;
      const hrs = Math.floor(mins / 60);
      return `${hrs}h left`;
    }

    function renderSingleMessage(msg) {
      const chatContainer = document.getElementById('chatMessages');
      const isMe = msg.sender_email === currentUser.email;
      const isImage = msg.message_text.startsWith('http') && !msg.message_text.includes('.webm') && !msg.message_text.includes('.mp3');
      const isVoice = msg.message_text.startsWith('data:audio') || msg.message_text.includes('.webm') || msg.message_text.includes('.mp3');
      
      let displayText = (isImage || isVoice) ? msg.message_text : decryptText(msg.message_text);
      displayText = displayText.replace(/([\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}])/gu, '<span class="animated-emoji">$1</span>');

      const timeTag = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const countdownStr = msg.expires_at ? `⏳ ${getRemainingTimeStr(msg.expires_at)}` : '';

      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2 group relative`;
      wrapper.setAttribute('data-msg-id', msg.id);

      let contentHtml = '';
      if (isImage) {
        contentHtml = `<img src="${displayText}" onclick="openLightbox('${displayText}')" class="rounded-xl max-w-xs max-h-64 object-cover cursor-pointer hover:opacity-90 shadow">`;
      } else if (isVoice) {
        contentHtml = `
          <div class="flex items-center space-x-2 py-1">
            <i class="fas fa-play text-emerald-600 cursor-pointer" onclick="this.nextElementSibling.play()"></i>
            <audio controls src="${displayText}" class="h-8 max-w-[180px]"></audio>
          </div>
        `;
      } else {
        contentHtml = `<div>${displayText}</div>`;
      }

      wrapper.innerHTML = `
        <span class="text-slate-400 mb-0.5 px-1" style="font-size: 0.75em;">${isMe ? 'You' : msg.sender_name} • ${timeTag} <span class="text-amber-600 font-medium countdown-tag" data-expires="${msg.expires_at || ''}">${countdownStr}</span></span>
        <div class="max-w-[80%] px-3.5 py-2.5 rounded-2xl shadow-sm relative ${isMe ? 'chat-bubble-me' : 'chat-bubble-them'}">
          ${contentHtml}
          <button onclick="toggleDeleteMenu(event, '${msg.id}')" class="absolute ${isMe ? '-left-6' : '-right-6'} top-2 opacity-0 group-hover:opacity-100 transition text-slate-400 hover:text-slate-700 px-1">
            <i class="fas fa-ellipsis-v"></i>
          </button>
          <div id="deleteMenu_${msg.id}" class="hidden absolute ${isMe ? 'right-0' : 'left-0'} top-8 bg-white text-slate-800 rounded-xl shadow-xl border border-slate-200 py-1 z-30 w-40">
            <button onclick="deleteMessage('${msg.id}', 'me')" class="w-full text-left px-3 py-2 hover:bg-slate-100 text-slate-700">Delete for Me</button>
            ${isMe ? `<button onclick="deleteMessage('${msg.id}', 'everyone')" class="w-full text-left px-3 py-2 hover:bg-slate-100 text-red-600 font-semibold">Delete for Everyone</button>` : ''}
          </div>
        </div>
      `;

      chatContainer.appendChild(wrapper);
      scrollToBottom();
    }

    function startCountdownTimerEngine() {
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        const tags = document.querySelectorAll('.countdown-tag');
        const nowMs = Date.now();
        let needsRefresh = false;

        tags.forEach(tag => {
          const exp = tag.getAttribute('data-expires');
          if (exp) {
            const expMs = new Date(exp).getTime();
            if (!isNaN(expMs) && expMs <= nowMs) {
              needsRefresh = true;
            } else if (!isNaN(expMs)) {
              tag.innerText = `⏳ ${getRemainingTimeStr(exp)}`;
            }
          }
        });

        if (needsRefresh) {
          filterAndRenderMessages();
        }
      }, 1000);
    }

    function toggleDeleteMenu(e, msgId) {
      e.stopPropagation();
      document.querySelectorAll('[id^="deleteMenu_"]').forEach(m => {
        if (m.id !== `deleteMenu_${msgId}`) m.classList.add('hidden');
      });
      const menu = document.getElementById(`deleteMenu_${msgId}`);
      menu.classList.toggle('hidden');
    }

    async function deleteMessage(msgId, scope) {
      deletedMessageIds.push(msgId);
      localStorage.setItem('safetalk_deleted_local', JSON.stringify(deletedMessageIds));
      filterAndRenderMessages();

      if (scope === 'everyone' && navigator.onLine) {
        await supabaseClient.from('messages').delete().eq('id', msgId);
      }
    }

    async function toggleVoiceRecording() {
      const bar = document.getElementById('voiceRecordingBar');
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopAndSendVoice();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.start();

        recordingSeconds = 0;
        bar.classList.remove('hidden');
        recordingTimerInterval = setInterval(() => {
          recordingSeconds++;
          document.getElementById('recordingTimer').innerText = `Recording: ${recordingSeconds}s`;
        }, 1000);
      } catch (err) {
        alert("Microphone access is required for voice messages.");
      }
    }

    function stopAndSendVoice() {
      if (!mediaRecorder) return;
      mediaRecorder.stop();
      clearInterval(recordingTimerInterval);
      document.getElementById('voiceRecordingBar').classList.add('hidden');

      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
          const base64Audio = reader.result;
          const senderName = familyMembers.find(m => m.email === currentUser.email)?.name || currentUser.email.split('@')[0];

          const newMessage = {
            id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
            sender_email: currentUser.email,
            sender_name: senderName,
            message_text: base64Audio,
            channel_type: currentChatType,
            recipient_email: currentRecipientEmail,
            group_id: currentGroupId,
            expires_at: computeExpiryTimestamp(),
            created_at: new Date().toISOString()
          };

          allLoadedMessages.push(newMessage);
          saveGlobalCache();
          filterAndRenderMessages();

          if (navigator.onLine) {
            await supabaseClient.from('messages').insert([newMessage]);
          } else {
            queueOfflineMessage(newMessage);
          }
        };
      };
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      const cipherText = encryptText(text);
      const senderName = familyMembers.find(m => m.email === currentUser.email)?.name || currentUser.email.split('@')[0];

      const newMessage = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
        sender_email: currentUser.email,
        sender_name: senderName,
        message_text: cipherText,
        channel_type: currentChatType,
        recipient_email: currentRecipientEmail,
        group_id: currentGroupId,
        expires_at: computeExpiryTimestamp(),
        created_at: new Date().toISOString()
      };

      allLoadedMessages.push(newMessage);
      saveGlobalCache();
      filterAndRenderMessages();

      if (navigator.onLine) {
        const { error } = await supabaseClient.from('messages').insert([newMessage]);
        if (error) console.error("Error sending message to Supabase:", error);
      } else {
        queueOfflineMessage(newMessage);
      }
    }

    function queueOfflineMessage(msg) {
      let queue = JSON.parse(localStorage.getItem('safetalk_offline_queue') || '[]');
      queue.push(msg);
      localStorage.setItem('safetalk_offline_queue', JSON.stringify(queue));
      updateSyncStatus(false);
    }

    async function processOfflineQueue() {
      if (!navigator.onLine) return;
      let queue = JSON.parse(localStorage.getItem('safetalk_offline_queue') || '[]');
      if (queue.length === 0) { updateSyncStatus(true); return; }

      for (let msg of queue) {
        await supabaseClient.from('messages').insert([msg]);
      }
      localStorage.removeItem('safetalk_offline_queue');
      updateSyncStatus(true);
    }

    function setupNetworkListener() {
      window.addEventListener('online', () => { updateSyncStatus(true); processOfflineQueue(); });
      window.addEventListener('offline', () => updateSyncStatus(false));
    }

    function updateSyncStatus(isOnline) {
      const ind = document.getElementById('syncStatusIndicator');
      ind.className = `w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse'}`;
    }

    function openGroupCreateModal() {
      const container = document.getElementById('groupMembersSelector');
      container.innerHTML = '';
      familyMembers.forEach(m => {
        if (m.email !== currentUser.email) {
          container.innerHTML += `
            <label class="flex items-center space-x-2 text-slate-700 cursor-pointer">
              <input type="checkbox" value="${m.email}" class="group-member-checkbox text-emerald-600 rounded">
              <span>${m.name}</span>
            </label>
          `;
        }
      });
      document.getElementById('createGroupModal').classList.remove('hidden');
    }

    function closeGroupModal() {
      document.getElementById('createGroupModal').classList.add('hidden');
    }

    function confirmCreateGroup() {
      const name = document.getElementById('groupNameInput').value.trim();
      if (!name) return;

      const checked = Array.from(document.querySelectorAll('.group-member-checkbox:checked')).map(c => c.value);
      checked.push(currentUser.email);

      const newGroup = {
        id: 'grp_' + Date.now(),
        name: name,
        admin: currentUser.email.split('@')[0],
        members: checked
      };

      customGroups.push(newGroup);
      localStorage.setItem('safetalk_custom_groups', JSON.stringify(customGroups));
      closeGroupModal();
      renderConversationsList();
    }

    function switchEmojiTab(tabKey) {
      ['smileys', 'gestures', 'hearts', 'animals', 'food', 'activities', 'travel'].forEach(k => {
        const btn = document.getElementById(`tab_${k}`);
        if (btn) {
          if (k === tabKey) {
            btn.className = "font-bold text-emerald-700 pb-0.5 border-b-2 border-emerald-600 shrink-0";
          } else {
            btn.className = "text-slate-500 hover:text-slate-800 pb-0.5 shrink-0";
          }
        }
      });

      const grid = document.getElementById('emojiGrid');
      grid.innerHTML = '';
      (emojiCategories[tabKey] || []).forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'hover:scale-125 transition transform p-1';
        btn.innerText = emoji;
        btn.onclick = () => insertEmoji(emoji);
        grid.appendChild(btn);
      });
    }

    function toggleEmojiPicker() {
      document.getElementById('emojiPicker').classList.toggle('hidden');
    }

    function insertEmoji(emoji) {
      const input = document.getElementById('messageInput');
      input.value += emoji;
      input.focus();
    }

    function updateAppBadge() {
      const totalUnread = Object.values(unreadCounts).reduce((a, b) => a + b, 0);
      document.title = totalUnread > 0 ? `(${totalUnread}) SafeTalk Messenger` : 'SafeTalk - Private Family Messenger';
    }

    function handleImageSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedImageFile = file;
      document.getElementById('modalImagePreview').src = URL.createObjectURL(file);
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.add('hidden');
      selectedImageFile = null;
    }

    async function confirmAndSendImage() {
      if (!selectedImageFile) return;
      const sendBtn = document.getElementById('sendImageBtn');
      sendBtn.disabled = true; sendBtn.innerText = "Uploading...";

      const fileName = `safetalk_${Date.now()}_${Math.random()}.jpg`;
      const filePath = `car-photos/${fileName}`;

      const { error: uploadError } = await supabaseClient.storage.from('car-photos').upload(filePath, selectedImageFile);
      if (uploadError) { alert("Upload error: " + uploadError.message); sendBtn.disabled = false; sendBtn.innerText = "Send Photo"; return; }

      const { data: publicUrlData } = supabaseClient.storage.from('car-photos').getPublicUrl(filePath);
      const senderName = familyMembers.find(m => m.email === currentUser.email)?.name || currentUser.email.split('@')[0];

      const newMessage = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
        sender_email: currentUser.email,
        sender_name: senderName,
        message_text: publicUrlData.publicUrl,
        channel_type: currentChatType,
        recipient_email: currentRecipientEmail,
        group_id: currentGroupId,
        expires_at: computeExpiryTimestamp(),
        created_at: new Date().toISOString()
      };

      allLoadedMessages.push(newMessage);
      saveGlobalCache();
      filterAndRenderMessages();

      if (navigator.onLine) {
        await supabaseClient.from('messages').insert([newMessage]);
      }
      closeImageModal();
      sendBtn.disabled = false; sendBtn.innerText = "Send Photo";
    }

    function changeFontSize(size) {
      document.getElementById('appBody').className = `bg-slate-100 font-sans h-full flex flex-col antialiased text-${size}-custom select-none`;
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightboxModal').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.add('hidden');
    }

    function scrollToBottom() {
      const chatContainer = document.getElementById('chatMessages');
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
