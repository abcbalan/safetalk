<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SafeTalk - Private Family Messenger</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    .chat-bubble-me { background: #15803d; color: white; border-bottom-right-radius: 4px; }
    .chat-bubble-them { background: #ffffff; color: #0f172a; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
    
    .text-sm-custom { font-size: 0.875rem; }
    .text-lg-custom { font-size: 1.05rem; }
    .text-xl-custom { font-size: 1.25rem; }

    /* Animated Emojis */
    .animated-emoji {
      display: inline-block;
      animation: emojiBounce 2s infinite ease-in-out;
    }
    @keyframes emojiBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.1); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body id="appBody" class="bg-slate-100 font-sans h-full flex flex-col antialiased text-sm-custom select-none">

    <div class="flex items-center space-x-3">
      <button id="backBtn" onclick="returnToChatList()" class="hidden text-white mr-1 text-base hover:text-emerald-200 transition">
        <i class="fas fa-arrow-left"></i>
      </button>
      
      <div id="headerAvatar" class="w-9 h-9 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-white shadow border border-emerald-500 text-sm">
        <i class="fas fa-shield-halved"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight flex items-center gap-2" id="activeChatTitle">
          SafeTalk Chats
          <span class="bg-emerald-950 text-emerald-300 text-[10px] px-2 py-0.5 rounded-full border border-emerald-700 font-medium">Encrypted</span>
        </h1>
        <p class="text-[11px] text-emerald-200" id="activeChatSub">Select a conversation to start</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <span id="syncStatusIndicator" class="w-2.5 h-2.5 rounded-full bg-emerald-400" title="Online & Synced"></span>
      <div id="currentUserBadge" class="text-xs text-emerald-100 bg-emerald-900 px-3 py-1.5 rounded-lg border border-emerald-700 font-medium">
        Connecting...
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- SIGNAL CHATS LIST SCREEN -->
    <div id="chatsListScreen" class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 h-full absolute md:relative z-20 inset-0 transition-all">
      <div class="p-3 bg-slate-50 border-b border-slate-100 flex flex-col gap-2">
        <div class="relative">
          <input type="text" id="chatSearchInput" oninput="filterChatList(this.value)" placeholder="Search conversations..." class="w-full bg-white text-xs px-3 py-2 pl-8 rounded-xl border border-slate-300 focus:outline-none focus:ring-1 focus:ring-emerald-600">
          <i class="fas fa-search absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
        </div>
        <button onclick="openGroupCreateModal()" class="w-full py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-xs rounded-xl shadow transition flex items-center justify-center space-x-1.5">
          <i class="fas fa-plus text-xs"></i>
          <span>Create New Group</span>
        </button>
      </div>

      <div class="p-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3">Conversations</div>
      <div id="conversationsContainer" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>
    </div>

    <!-- CHAT CONVERSATION SCREEN -->
    <main id="chatRoomScreen" class="flex-1 flex flex-col bg-slate-100 absolute md:relative inset-0 z-10 md:z-auto hidden">
      
      <!-- Header Controls: History Search, Auto Delete, Font Size -->
      <div class="p-2 bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0">
        <div class="relative flex-1 max-w-xs">
          <input type="text" id="historySearchInput" oninput="filterMessageHistory()" placeholder="Search messages..." class="w-full bg-slate-100 text-xs px-3 py-1.5 pl-8 rounded-lg border border-slate-300 focus:outline-none">

        </div>

        <div class="flex items-center space-x-2 ml-2">

          <select id="retentionSelect" class="text-xs bg-slate-100 border border-slate-300 rounded-lg px-2 py-1.5 text-slate-700 focus:outline-none font-medium">
            <option value="forever">⏳ Keep Forever</option>
            <option value="1m">⏱️ Delete (1 Min Test)</option>
            <option value="8h">⏳ Delete (8 Hours)</option>
            <option value="7d">⏳ Delete (1 Week)</option>

          <select id="fontSizeSelect" onchange="changeFontSize(this.value)" class="text-xs bg-slate-100 border border-slate-300 rounded-lg px-2 py-1.5 focus:outline-none">
            <option value="sm">Normal</option>
            <option value="lg">Large</option>

      <!-- VOICE RECORDING BAR -->

          <i class="fas fa-paper-plane mr-1"></i> Send Voice

      <div id="emojiPicker" class="hidden bg-white border-t border-slate-200 flex flex-col max-h-52 overflow-y-auto p-2 shadow-inner shrink-0">
        <div id="emojiTabNav" class="flex gap-3 border-b border-slate-200 pb-1.5 mb-2 text-xs text-slate-500 overflow-x-auto shrink-0">

          <button type="button" onclick="switchEmojiTab('animals')" id="tab_animals" class="hover:text-slate-800">Animals</button>
          <button type="button" onclick="switchEmojiTab('food')" id="tab_food" class="hover:text-slate-800">Food</button>
          <button type="button" onclick="switchEmojiTab('activities')" id="tab_activities" class="hover:text-slate-800">Activities</button>

        <div class="flex gap-2 items-center">
          <label class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full cursor-pointer transition flex items-center justify-center shrink-0" title="Select Photo">
            <i class="fas fa-camera text-base"></i>
            <input type="file" id="chatImageInput" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
          </label>

          <button type="button" id="micBtn" onclick="toggleVoiceRecording()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-emerald-700 rounded-full transition flex items-center justify-center shrink-0" title="Record Voice">
            <i class="fas fa-microphone text-base"></i>

          <button type="button" onclick="toggleEmojiPicker()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-amber-500 rounded-full transition flex items-center justify-center shrink-0" title="Insert Emoji">
            <i class="fas fa-face-smile text-base"></i>

          <input type="text" id="messageInput" placeholder="SafeTalk message..." class="flex-1 px-4 py-2 border border-slate-300 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white">
          
          <button type="submit" class="w-10 h-10 bg-emerald-700 hover:bg-emerald-800 text-white rounded-full shadow transition flex items-center justify-center shrink-0">
            <i class="fas fa-paper-plane text-sm"></i>

    </main>

  <!-- GROUP CREATION MODAL -->

    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 flex flex-col">
      <h3 class="font-bold text-slate-900 text-sm mb-3">Create Custom Family Group</h3>
      <input type="text" id="groupNameInput" placeholder="Group Name (e.g. Weekend Trips)" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs mb-3">
      
      <div class="text-xs font-semibold text-slate-700 mb-2">Select Members & Admin:</div>
      <div id="groupMembersSelector" class="space-y-2 max-h-40 overflow-y-auto mb-4 border border-slate-100 p-2 rounded-xl"></div>

      <div class="flex gap-2 w-full">
        <button onclick="closeGroupModal()" class="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold text-xs rounded-xl">Cancel</button>
        <button onclick="confirmCreateGroup()" class="flex-1 py-2.5 bg-emerald-700 text-white font-bold text-xs rounded-xl shadow">Create Group</button>
      </div>
    </div>
  </div>

  <!-- IMAGE PREVIEW MODAL -->
  <div id="imageModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden p-5 flex flex-col items-center">
      <h3 class="font-bold text-slate-900 text-sm mb-3">Send Photo via SafeTalk</h3>
      <div class="w-full h-48 bg-slate-100 rounded-xl overflow-hidden mb-4 border border-slate-200">
        <img id="modalImagePreview" class="w-full h-full object-cover" src="" alt="Preview">
      </div>
      <div class="flex gap-2 w-full">
        <button onclick="closeImageModal()" class="flex-1 py-2.5 bg-slate-200 text-slate-700 font-bold text-xs rounded-xl">Cancel</button>
        <button onclick="confirmAndSendImage()" id="sendImageBtn" class="flex-1 py-2.5 bg-emerald-700 text-white font-bold text-xs rounded-xl shadow">Send Photo</button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightboxModal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4" onclick="closeLightbox()">
    <img id="lightboxImg" class="max-w-full max-h-full rounded-lg shadow-2xl object-contain">
  </div>

  <script>

    const SUPABASE_ANON_KEY = 'sb_publishable_fl7g8SR6zNJmo06dw4EB1Q_s8ee16Je';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const SECRET_KEY = "SafeTalkFamilyKey2026";

    const familyMembers = [

      gestures: ['👍', '👎', '👋', '🙏', '👏', '🤝', '✌️', '💪', '👊', '🙌', '🔥', '✨', '🎉', '💪', '👈', '👉', '👆', '👇', '🤞', '🖖', '🤘', '🤙'],
      hearts: ['❤️', '💖', '💙', '💚', '💛', '💜', '🖤', '💔', '💕', '💘', '💗', '💓', '💞', '💌', '💟', '❣️'],
      animals: ['🐶', '🐱', '🦁', '🐼', '🐨', '🦊', '🐯', '🦄', '🐝', '🦉', '🦋', '🐢', '🐍', '🐳', '🐬', '🐙', '🦖', '🦕', '🐇', '🦥'],
      food: ['🍎', '🍕', '🍔', '🍟', '🍦', '🍩', '☕', '🥤', '🍿', '🍣', '🎂', '🍪', '🍫', '🍺', '🍷', '🍉', '🍓', '🥑', '🌮', '🍜'],
      activities: ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏉', '🎱', '🏓', '🏸', '🏒', '🥊', '🥋', '🛹', '⛳', '⛸️', '🎣', '🎽', '🎿', '🎳'],
      travel: ['🚗', '🚕', '🚙', '🚌', '🚎', '🏎️', '🚓', '🚑', '🚒', '🚐', '🚚', '🚛', '🚜', '🛵', '🏍️', '🚲', '🛴', '✈️', '🚀', '🛸']
    };

    let currentUser = null;
    let currentChatType = 'direct';
    let currentRecipientEmail = null;
    let currentGroupId = null;
    let selectedImageFile = null;
    let allLoadedMessages = [];
    let customGroups = JSON.parse(localStorage.getItem('safetalk_custom_groups') || '[]');
    let unreadCounts = JSON.parse(localStorage.getItem('safetalk_unread') || '{}');

    let mediaRecorder = null;
    let audioChunks = [];
    let recordingTimerInterval = null;
    let recordingSeconds = 0;

    function encryptText(text) {
      if (text.startsWith('http') || text.startsWith('data:audio')) return text;
      try {
        const encoded = encodeURIComponent(text);
        return "ENC:" + btoa(encoded.split('').map((c, i) => 
          String.fromCharCode(c.charCodeAt(0) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length))
        ).join(''));
      } catch (e) {
        return text;
      }
    }

    function decryptText(cipherText) {
      if (!cipherText.startsWith("ENC:")) return cipherText;
      try {
        const rawCipher = cipherText.replace("ENC:", "");
        const decodedXor = atob(rawCipher).split('').map((c, i) => 
          String.fromCharCode(c.charCodeAt(0) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length))
        ).join('');
        return decodeURIComponent(decodedXor);
      } catch(e) {
        return cipherText;
      }
    }

    async function initApp() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        const email = prompt("Enter your SafeTalk email (mum@family.com, dad@family.com, alex@family.com, sarah@family.com):", "dad@family.com");
        if (!email) return;
        const password = prompt("Enter your password:", "123456");
        if (!password) return;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { alert("Login failed: " + error.message); location.reload(); return; }
        currentUser = data.user;
      } else {
        currentUser = session.user;
      }

      setupUserInterface();
      renderConversationsList();
      subscribeToRealtime();
      setupNetworkListener();
      processOfflineQueue();
      switchEmojiTab('smileys');
    }

    function setupUserInterface() {
      const member = familyMembers.find(m => m.email === currentUser.email) || { name: currentUser.email.split('@')[0], icon: "fa-user", bg: "bg-emerald-600" };
      document.getElementById('currentUserBadge').innerText = `👤 ${member.name}`;
      document.getElementById('headerAvatar').innerHTML = `<i class="fas ${member.icon}"></i>`;
      document.getElementById('headerAvatar').className = `w-9 h-9 rounded-full ${member.bg} flex items-center justify-center font-bold text-white shadow border border-emerald-500 text-sm`;
    }

    function renderConversationsList(filter = '') {
      const container = document.getElementById('conversationsContainer');
      container.innerHTML = '';

      customGroups.forEach(grp => {
        if (!filter || grp.name.toLowerCase().includes(filter.toLowerCase())) {
          const div = document.createElement('div');
          const isUnread = (unreadCounts[grp.id] || 0) > 0;
          div.className = `p-3.5 hover:bg-slate-50 cursor-pointer transition flex items-center space-x-3 ${isUnread ? 'bg-emerald-50/60 font-bold' : ''}`;
          div.onclick = () => openChatRoom('group', grp.id, grp.name, 'bg-emerald-700', 'fa-users');
          div.innerHTML = `
            <div class="w-11 h-11 rounded-full bg-emerald-700 flex items-center justify-center text-white font-bold shrink-0 shadow-sm relative">
              <i class="fas fa-users text-sm"></i>
              ${isUnread ? `<span class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">${unreadCounts[grp.id]}</span>` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-slate-800 text-sm truncate ${isUnread ? 'font-bold' : 'font-semibold'}">${grp.name}</div>
              <div class="text-[11px] text-slate-500 truncate">Admin: ${grp.admin}</div>
            </div>
          `;
          container.appendChild(div);
        }
      });

      familyMembers.forEach(member => {
        if (member.email !== currentUser.email && (!filter || member.name.toLowerCase().includes(filter.toLowerCase()))) {
          const div = document.createElement('div');
          const isUnread = (unreadCounts[member.email] || 0) > 0;
          div.className = `p-3.5 hover:bg-slate-50 cursor-pointer transition flex items-center space-x-3 ${isUnread ? 'bg-emerald-50/60 font-bold' : ''}`;
          div.onclick = () => openChatRoom('direct', member.email, member.name, member.bg, member.icon);
          div.innerHTML = `
            <div class="w-11 h-11 rounded-full ${member.bg} flex items-center justify-center text-white font-bold text-sm shrink-0 shadow-sm relative">
              <i class="fas ${member.icon}"></i>
              ${isUnread ? `<span class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">${unreadCounts[member.email]}</span>` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-slate-800 text-sm truncate ${isUnread ? 'font-bold' : 'font-semibold'}">${member.name}</div>
              <div class="text-[11px] text-slate-500 truncate">Direct encrypted messaging</div>
            </div>
          `;
          container.appendChild(div);
        }
      });
    }

    function filterChatList(query) {
      renderConversationsList(query);
    }

    function openChatRoom(type, identifier, name, bgClass, iconClass) {
      currentChatType = type;
      if (type === 'group') {
        currentGroupId = identifier;
        currentRecipientEmail = null;
        unreadCounts[identifier] = 0;
      } else {
        currentRecipientEmail = identifier;
        currentGroupId = null;
        unreadCounts[identifier] = 0;
      }
      localStorage.setItem('safetalk_unread', JSON.stringify(unreadCounts));
      updateAppBadge();

      document.getElementById('activeChatTitle').innerText = name;
      document.getElementById('activeChatSub').innerText = type === 'group' ? "Custom Group Chat" : "Direct Message";
      document.getElementById('headerAvatar').innerHTML = `<i class="fas ${iconClass}"></i>`;
      document.getElementById('headerAvatar').className = `w-9 h-9 rounded-full ${bgClass} flex items-center justify-center font-bold text-white shadow border border-emerald-500 text-sm`;

      document.getElementById('chatsListScreen').classList.add('hidden', 'md:flex');
      document.getElementById('chatRoomScreen').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');

      loadMessages();
    }

    function returnToChatList() {
      document.getElementById('chatsListScreen').classList.remove('hidden', 'md:flex');
      document.getElementById('chatRoomScreen').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');

      document.getElementById('activeChatTitle').innerText = "SafeTalk Chats";
      document.getElementById('activeChatSub').innerText = "Select a conversation to start";
      setupUserInterface();
      renderConversationsList();
    }

    function getCacheKey() {
      return `safetalk_msgs_${currentChatType}_${currentGroupId || currentRecipientEmail}`;
    }

    async function loadMessages() {
      const chatContainer = document.getElementById('chatMessages');
      
      const cached = JSON.parse(localStorage.getItem(getCacheKey()) || '[]');
      if (cached.length > 0) {
        allLoadedMessages = cached;
        renderFilteredMessages(allLoadedMessages);
      } else {
        chatContainer.innerHTML = '<div class="text-center text-xs text-slate-400 py-4"><i class="fas fa-spinner fa-spin mr-1"></i> Loading messages...</div>';
      }

      if (!navigator.onLine) return;

      let query = supabaseClient.from('messages').select('*');
      if (currentChatType === 'group') {
        query = query.eq('group_id', currentGroupId);
      } else {
        query = query.eq('channel_type', 'direct')
          .or(`and(sender_email.eq.${currentUser.email},recipient_email.eq.${currentRecipientEmail}),and(sender_email.eq.${currentRecipientEmail},recipient_email.eq.${currentUser.email})`);
      }

      const { data, error } = await query.order('created_at', { ascending: true });
      if (error) { console.error("Error loading messages:", error); return; }

      if (data) {
        const nowIso = new Date().toISOString();
        const validMsgs = data.filter(msg => !msg.expires_at || msg.expires_at > nowIso);
        allLoadedMessages = validMsgs;
        localStorage.setItem(getCacheKey(), JSON.stringify(validMsgs));
        renderFilteredMessages(validMsgs);
      }
    }

    function filterMessageHistory() {
      const query = (document.getElementById('historySearchInput').value || '').toLowerCase();
      if (!query) {
        renderFilteredMessages(allLoadedMessages);
        return;
      }
      const filtered = allLoadedMessages.filter(msg => {
        const text = msg.message_text.startsWith('http') ? '' : decryptText(msg.message_text).toLowerCase();
        return text.includes(query) || msg.sender_name.toLowerCase().includes(query);
      });
      renderFilteredMessages(filtered);
    }

    function renderFilteredMessages(messages) {
      const chatContainer = document.getElementById('chatMessages');
      chatContainer.innerHTML = '';
      messages.forEach(msg => renderSingleMessage(msg));
      scrollToBottom();
    }

    function computeExpiryTimestamp() {
      const retentionVal = document.getElementById('retentionSelect').value;
      if (retentionVal === 'forever') return null;
      const now = new Date();
      if (retentionVal === '1m') now.setMinutes(now.getMinutes() + 1);
      else if (retentionVal === '8h') now.setHours(now.getHours() + 8);
      else if (retentionVal === '7d') now.setDate(now.getDate() + 7);
      return now.toISOString();
    }

    function renderSingleMessage(msg) {
      const chatContainer = document.getElementById('chatMessages');
      const isMe = msg.sender_email === currentUser.email;
      const isImage = msg.message_text.startsWith('http') && !msg.message_text.includes('.webm') && !msg.message_text.includes('.mp3');
      const isVoice = msg.message_text.startsWith('data:audio') || msg.message_text.includes('.webm') || msg.message_text.includes('.mp3');
      
      let displayText = (isImage || isVoice) ? msg.message_text : decryptText(msg.message_text);
      displayText = displayText.replace(/([\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}])/gu, '<span class="animated-emoji">$1</span>');

      const timeTag = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2 group relative`;

      let contentHtml = '';
      if (isImage) {
        contentHtml = `<img src="${displayText}" onclick="openLightbox('${displayText}')" class="rounded-xl max-w-xs max-h-64 object-cover cursor-pointer hover:opacity-90 shadow">`;
      } else if (isVoice) {
        contentHtml = `
          <div class="flex items-center space-x-2 py-1">
            <i class="fas fa-play text-emerald-600 text-xs cursor-pointer" onclick="this.nextElementSibling.play()"></i>
            <audio controls src="${displayText}" class="h-8 max-w-[180px]"></audio>
          </div>
        `;
      } else {
        contentHtml = `<div>${displayText}</div>`;
      }

      wrapper.innerHTML = `
        <span class="text-[10px] text-slate-400 mb-0.5 px-1">${isMe ? 'You' : msg.sender_name} • ${timeTag}</span>
        <div class="max-w-[80%] px-3.5 py-2.5 rounded-2xl shadow-sm relative ${isMe ? 'chat-bubble-me' : 'chat-bubble-them'}">
          ${contentHtml}
          <!-- Delete Dropdown Action Button inside bubble bounds -->
          <button onclick="toggleDeleteMenu(event, '${msg.id}')" class="absolute ${isMe ? '-left-6' : '-right-6'} top-2 text-xs opacity-0 group-hover:opacity-100 transition text-slate-400 hover:text-slate-700 px-1">
            <i class="fas fa-ellipsis-v"></i>
          </button>
          <div id="deleteMenu_${msg.id}" class="hidden absolute ${isMe ? 'right-0' : 'left-0'} top-8 bg-white text-slate-800 rounded-xl shadow-xl border border-slate-200 py-1 z-30 w-40">
            <button onclick="deleteMessage('${msg.id}', 'me')" class="w-full text-left px-3 py-2 hover:bg-slate-100 text-slate-700">Delete for Me</button>
            ${isMe ? `<button onclick="deleteMessage('${msg.id}', 'everyone')" class="w-full text-left px-3 py-2 hover:bg-slate-100 text-red-600 font-semibold">Delete for Everyone</button>` : ''}
          </div>
        </div>
      `;

      chatContainer.appendChild(wrapper);
      scrollToBottom();
    }

    function toggleDeleteMenu(e, msgId) {
      e.stopPropagation();
      // Close any other open menus first
      document.querySelectorAll('[id^="deleteMenu_"]').forEach(m => {
        if (m.id !== `deleteMenu_${msgId}`) m.classList.add('hidden');
      });
      const menu = document.getElementById(`deleteMenu_${msgId}`);
      menu.classList.toggle('hidden');
    }

    async function deleteMessage(msgId, scope) {
      allLoadedMessages = allLoadedMessages.filter(m => m.id !== msgId);
      localStorage.setItem(getCacheKey(), JSON.stringify(allLoadedMessages));
      renderFilteredMessages(allLoadedMessages);

      if (scope === 'everyone' && navigator.onLine) {
        await supabaseClient.from('messages').delete().eq('id', msgId);
      }
    }

    async function toggleVoiceRecording() {
      const bar = document.getElementById('voiceRecordingBar');
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopAndSendVoice();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.start();

        recordingSeconds = 0;
        bar.classList.remove('hidden');
        recordingTimerInterval = setInterval(() => {
          recordingSeconds++;
          document.getElementById('recordingTimer').innerText = `Recording: ${recordingSeconds}s`;
        }, 1000);
      } catch (err) {
        alert("Microphone access is required for voice messages.");
      }
    }

    function stopAndSendVoice() {
      if (!mediaRecorder) return;
      mediaRecorder.stop();
      clearInterval(recordingTimerInterval);
      document.getElementById('voiceRecordingBar').classList.add('hidden');

      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
          const base64Audio = reader.result;
          const senderName = familyMembers.find(m => m.email === currentUser.email)?.name || currentUser.email.split('@')[0];

          const newMessage = {
            id: 'msg_' + Date.now(),
            sender_email: currentUser.email,
            sender_name: senderName,
            message_text: base64Audio,
            channel_type: currentChatType,
            recipient_email: currentRecipientEmail,
            group_id: currentGroupId,
            expires_at: computeExpiryTimestamp(),
            created_at: new Date().toISOString()
          };

          allLoadedMessages.push(newMessage);
          localStorage.setItem(getCacheKey(), JSON.stringify(allLoadedMessages));
          renderSingleMessage(newMessage);

          if (navigator.onLine) {
            await supabaseClient.from('messages').insert([newMessage]);
          } else {
            queueOfflineMessage(newMessage);
          }
        };
      };
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      const cipherText = encryptText(text);
      const senderName = familyMembers.find(m => m.email === currentUser.email)?.name || currentUser.email.split('@')[0];

      const newMessage = {
        id: 'msg_' + Date.now(),
        sender_email: currentUser.email,
        sender_name: senderName,
        message_text: cipherText,
        channel_type: currentChatType,
        recipient_email: currentRecipientEmail,
        group_id: currentGroupId,
        expires_at: computeExpiryTimestamp(),
        created_at: new Date().toISOString()
      };

      allLoadedMessages.push(newMessage);
      localStorage.setItem(getCacheKey(), JSON.stringify(allLoadedMessages));
      renderSingleMessage(newMessage);

      if (navigator.onLine) {
        await supabaseClient.from('messages').insert([newMessage]);
      } else {
        queueOfflineMessage(newMessage);
      }
    }

    function queueOfflineMessage(msg) {
      let queue = JSON.parse(localStorage.getItem('safetalk_offline_queue') || '[]');
      queue.push(msg);
      localStorage.setItem('safetalk_offline_queue', JSON.stringify(queue));
      updateSyncStatus(false);
    }

    async function processOfflineQueue() {
      if (!navigator.onLine) return;
      let queue = JSON.parse(localStorage.getItem('safetalk_offline_queue') || '[]');
      if (queue.length === 0) { updateSyncStatus(true); return; }

      for (let msg of queue) {
        await supabaseClient.from('messages').insert([msg]);
      }
      localStorage.removeItem('safetalk_offline_queue');
      updateSyncStatus(true);
    }

    function setupNetworkListener() {
      window.addEventListener('online', () => { updateSyncStatus(true); processOfflineQueue(); });
      window.addEventListener('offline', () => updateSyncStatus(false));
    }

    function updateSyncStatus(isOnline) {
      const ind = document.getElementById('syncStatusIndicator');
      ind.className = `w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse'}`;
    }

    function openGroupCreateModal() {
      const container = document.getElementById('groupMembersSelector');
      container.innerHTML = '';
      familyMembers.forEach(m => {
        if (m.email !== currentUser.email) {
          container.innerHTML += `
            <label class="flex items-center space-x-2 text-xs text-slate-700 cursor-pointer">
              <input type="checkbox" value="${m.email}" class="group-member-checkbox text-emerald-600 rounded">
              <span>${m.name}</span>
            </label>
          `;
        }
      });
      document.getElementById('createGroupModal').classList.remove('hidden');
    }

    function closeGroupModal() {
      document.getElementById('createGroupModal').classList.add('hidden');
    }

    function confirmCreateGroup() {
      const name = document.getElementById('groupNameInput').value.trim();
      if (!name) return;

      const checked = Array.from(document.querySelectorAll('.group-member-checkbox:checked')).map(c => c.value);
      checked.push(currentUser.email);

      const newGroup = {
        id: 'grp_' + Date.now(),
        name: name,
        admin: currentUser.email.split('@')[0],
        members: checked
      };

      customGroups.push(newGroup);
      localStorage.setItem('safetalk_custom_groups', JSON.stringify(customGroups));
      closeGroupModal();
      renderConversationsList();
    }

    // --- EMOJI CATEGORY TABS FIX ---
    function switchEmojiTab(tabKey) {
      // Update active tab styles
      ['smileys', 'gestures', 'hearts', 'animals', 'food', 'activities', 'travel'].forEach(k => {
        const btn = document.getElementById(`tab_${k}`);
        if (btn) {
          if (k === tabKey) {
            btn.className = "font-bold text-emerald-700 pb-0.5 border-b-2 border-emerald-600 shrink-0";
          } else {
            btn.className = "text-slate-500 hover:text-slate-800 pb-0.5 shrink-0";
          }
        }
      });

      const grid = document.getElementById('emojiGrid');
      grid.innerHTML = '';
      (emojiCategories[tabKey] || []).forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'hover:scale-125 transition transform p-1';
        btn.innerText = emoji;
        btn.onclick = () => insertEmoji(emoji);
        grid.appendChild(btn);
      });
    }

    function toggleEmojiPicker() {
      document.getElementById('emojiPicker').classList.toggle('hidden');
    }

    function insertEmoji(emoji) {
      const input = document.getElementById('messageInput');
      input.value += emoji;
      input.focus();
    }

    function updateAppBadge() {
      const totalUnread = Object.values(unreadCounts).reduce((a, b) => a + b, 0);
      document.title = totalUnread > 0 ? `(${totalUnread}) SafeTalk Messenger` : 'SafeTalk - Private Family Messenger';
    }

    function subscribeToRealtime() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const msg = payload.new;
          if (msg.sender_email !== currentUser.email) {
            const key = msg.channel_type === 'group' ? msg.group_id : msg.sender_email;
            if (currentChatType === msg.channel_type && (currentRecipientEmail === msg.sender_email || currentGroupId === msg.group_id)) {
              renderSingleMessage(msg);
            } else {
              unreadCounts[key] = (unreadCounts[key] || 0) + 1;
              localStorage.setItem('safetalk_unread', JSON.stringify(unreadCounts));
              updateAppBadge();
              renderConversationsList();
            }
          }
        })
        .subscribe();
    }

    function handleImageSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedImageFile = file;
      document.getElementById('modalImagePreview').src = URL.createObjectURL(file);
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.add('hidden');
      selectedImageFile = null;
    }

    async function confirmAndSendImage() {
      if (!selectedImageFile) return;
      const sendBtn = document.getElementById('sendImageBtn');
      sendBtn.disabled = true; sendBtn.innerText = "Uploading...";

      const fileName = `safetalk_${Date.now()}_${Math.random()}.jpg`;
      const filePath = `car-photos/${fileName}`;

      const { error: uploadError } = await supabaseClient.storage.from('car-photos').upload(filePath, selectedImageFile);
      if (uploadError) { alert("Upload error: " + uploadError.message); sendBtn.disabled = false; sendBtn.innerText = "Send Photo"; return; }

      const { data: publicUrlData } = supabaseClient.storage.from('car-photos').getPublicUrl(filePath);
      const senderName = familyMembers.find(m => m.email === currentUser.email)?.name || currentUser.email.split('@')[0];

      const newMessage = {
        id: 'msg_' + Date.now(),
        sender_email: currentUser.email,
        sender_name: senderName,
        message_text: publicUrlData.publicUrl,
        channel_type: currentChatType,
        recipient_email: currentRecipientEmail,
        group_id: currentGroupId,
        expires_at: computeExpiryTimestamp(),
        created_at: new Date().toISOString()
      };

      allLoadedMessages.push(newMessage);
      localStorage.setItem(getCacheKey(), JSON.stringify(allLoadedMessages));
      renderSingleMessage(newMessage);

      if (navigator.onLine) {
        await supabaseClient.from('messages').insert([newMessage]);
      }
      closeImageModal();
      sendBtn.disabled = false; sendBtn.innerText = "Send Photo";
    }

    // --- MATCH FONT SIZE FOR DELETE MENU ---
    function changeFontSize(size) {
      document.getElementById('appBody').className = `bg-slate-100 font-sans h-full flex flex-col antialiased text-${size}-custom select-none`;
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightboxModal').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.add('hidden');
    }

    function scrollToBottom() {
      const chatContainer = document.getElementById('chatMessages');
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
